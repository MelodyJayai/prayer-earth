name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test and web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_APP_ENV: test
      EXPO_PUBLIC_API_TIMEOUT_MS: 10000
      EXPO_PUBLIC_ENABLE_REMOTE_CONTENT: false
      EXPO_PUBLIC_ENABLE_ANALYTICS: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python test dependencies
        run: python -m pip install Pillow==12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Backend and reader regression tests
        run: python -m unittest scripts.test_admin_backend scripts.test_generate_reader scripts.test_resilience_tools scripts.test_reader_publisher

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Export web bundle
        run: npm run build:web
